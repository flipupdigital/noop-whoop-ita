# Sideload APK for the Italian fork.
#
# assembleFullRelease reads android/fork.properties, so the id is
# com.noop.whoop.ita and the APK is signed with android/fork-debug.keystore
# (there is no upload keystore in this repo). Play Protect will warn. The
# package is not the Play Store build and it is not a debug build: the debug
# build type would be com.noop.whoop.ita.debug.
name: Android APK

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build release APK (debug key, fork id)
        run: ./gradlew assembleFullRelease --stacktrace

      - name: Name the APK
        run: |
          cp app/build/outputs/apk/full/release/*.apk "$GITHUB_WORKSPACE/NOOP-IT-android.apk"
          aapt="$(find "${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}/build-tools" -name aapt -type f 2>/dev/null | sort | tail -n 1 || true)"
          if [ -n "$aapt" ]; then
            "$aapt" dump badging "$GITHUB_WORKSPACE/NOOP-IT-android.apk" | head -n 5
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NOOP-IT-android
          path: NOOP-IT-android.apk
          if-no-files-found: error
          retention-days: 30

  release:
    if: github.event_name == 'workflow_dispatch'
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: NOOP-IT-android

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=noop-it-latest
          SHA="${GITHUB_SHA:0:7}"
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
            --title "NOOP IT Android · ${SHA}" \
            --notes "Sideload APK for the Italian fork. applicationId \`com.noop.whoop.ita\`. Signed with the repo debug keystore, not a Play upload key. Install steps: docs/FORK-IT.md." \
            NOOP-IT-android.apk
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
