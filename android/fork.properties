# FlipUp Italian fork identity. This file is not in ryanbr/noop.
# When it is present, release builds use this application id so the APK installs
# beside official NOOP (com.noop.whoop), and they may be signed with the debug
# keystore already in this repo (android/fork-debug.keystore). Delete this file
# to build as stock com.noop.whoop, which again requires keystore.properties
# for a real release.
applicationId=com.noop.whoop.ita
versionNameSuffix=-it
